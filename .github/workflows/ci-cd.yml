name: Snake Ladder CI/CD

on:
  push:
    branches:
      - saristy
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: snake-ladder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' js_files < <(
            find js utils -type f -name '*.js' -print0 2>/dev/null || true
          )

          if [ "${#js_files[@]}" -eq 0 ]; then
            echo "No JavaScript files found in js/ or utils/; skipping syntax checks."
            exit 0
          fi

          for file in "${js_files[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done

  docker-build-and-smoke-test:
    name: Build Docker image and smoke test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t snake-ladder:test .

      - name: Start container
        run: docker run -d --name snake-ladder-test -p 8080:80 snake-ladder:test

      - name: Check application HTTP response
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://localhost:8080/; then
              echo
              echo "Application responded successfully."
              exit 0
            fi

            echo "Waiting for the web server (attempt ${attempt}/15)..."
            sleep 2
          done

          echo "The application did not become available on http://localhost:8080/"
          docker logs snake-ladder-test
          exit 1

      - name: Stop and remove test container
        if: always()
        run: docker rm --force snake-ladder-test || true

  publish-image:
    name: Publish image to GitHub Container Registry
    runs-on: ubuntu-latest
    needs:
      - validate
      - docker-build-and-smoke-test
    # Publish only after a successful push to main, never for pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
