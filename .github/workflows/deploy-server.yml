name: CI/CD - Build, Push and Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: snake-ladder

jobs:
  build-and-test:
    name: CI - Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME .

      - name: Run container and test it
        run: |
          docker run -d --name test-game -p 8080:80 $IMAGE_NAME
          sleep 5
          curl -f http://localhost:8080 | grep -i "<html"

  push-image:
    name: CD - Push image to Docker Hub
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/snake-ladder:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/snake-ladder:${{ github.sha }}

  deploy:
    name: CD - Deploy on server
    needs: push-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/snake-ladder:latest
            docker rm -f snake-ladder || true
            docker run -d --name snake-ladder --restart always -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/snake-ladder:latest
            docker image prune -f
